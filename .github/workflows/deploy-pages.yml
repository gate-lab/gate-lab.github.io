name: Deploy GateLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Current david-priest/GateLab master commit (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      deploy: ${{ steps.source.outputs.deploy }}
    steps:
      - name: Read the current public GateLab release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: david-priest/GateLab
          ref: master
          path: public-source
          persist-credentials: false

      - name: Resolve the release commit
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha=$(git -C public-source rev-parse HEAD)
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Public master did not resolve to a full commit SHA.' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'source_sha must contain exactly 40 lowercase hexadecimal characters.' >&2
              exit 1
            fi
            if [[ "$REQUESTED_SHA" != "$current_sha" ]]; then
              echo 'Skipping stale release notification; public master has advanced.'
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "source_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public GateLab release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: david-priest/GateLab
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: app
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build for the root URL
        working-directory: app
        run: npm run build -- --base=/

      - name: Include source provenance and licenses
        working-directory: app
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.md dist/
          mkdir -p dist/third-party-licenses/GateLabR
          cp vendor/GateLabR/LICENSE dist/third-party-licenses/GateLabR/
          find node_modules -type f \( -iname 'license*' -o -iname 'copying*' \) \
            -exec cp --parents '{}' dist/third-party-licenses/ \;
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          writeFileSync('dist/source.json', JSON.stringify({
            repository: 'https://github.com/david-priest/GateLab',
            commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
          }, null, 2) + '\n');
          JS

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: app/dist
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
